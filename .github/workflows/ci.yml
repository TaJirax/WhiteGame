name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the release job widens it to contents: write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.2 needs JDK 17 to run, regardless of the 1.8 source/target level.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # No signing secrets here: this job also runs for pull requests, including
      # from forks. Debug falls back to the local Android debug key.
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

  release:
    name: Signed release
    # Tags only. Never runs for a pull request, so a fork cannot reach the
    # signing secrets.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check the tag matches versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$tag versionName=$name"
          if [ "$tag" != "$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name in app/build.gradle.kts"
            exit 1
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set - see keystore/README.md"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/whitebooster.jks
          echo "keystore restored ($(stat -c%s keystore/whitebooster.jks) bytes)"

      - name: Build release APKs
        env:
          WG_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # Universal first, then move it aside: the per-ABI run writes into the
          # same output directory.
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/WhiteGame-${version}-universal.apk"

          ./gradlew assembleRelease -Pabi=armeabi-v7a,arm64-v8a --no-daemon
          for abi in armeabi-v7a arm64-v8a; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" \
               "dist/WhiteGame-${version}-${abi}.apk"
          done
          ls -la dist/

      # An unsigned APK still builds successfully, so verify rather than assume:
      # publishing one would ship a release nobody can install as an update.
      - name: Verify every APK is signed with the release key
        # The exact certificate Android compares on update. Pinning the digest
        # catches an unsigned build, a debug-signed build, and a build signed
        # with the wrong key -- any of which ships a release that existing
        # installs refuse to upgrade. Rotating the signing key means updating
        # this digest too.
        env:
          EXPECTED_SHA256: fd836d6866d2c5f4f1bbcf9566b07e73d37a348438e69a31a3b01c1ca5351ec7
        run: |
          set -eu
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            certs=$("$apksigner" verify --print-certs "$apk" || true)
            got=$(printf '%s' "$certs" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
            echo "$apk -> ${got:-<unsigned>}"
            if [ "$got" != "$EXPECTED_SHA256" ]; then
              echo "::error::$apk signing cert ${got:-<unsigned>} does not match the WhiteGame release key"
              exit 1
            fi
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "WhiteGame ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Remove keystore from the runner
        if: always()
        run: rm -f keystore/whitebooster.jks
